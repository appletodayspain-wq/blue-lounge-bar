<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#060B20">
<link rel="icon" type="image/png" href="img/logo-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="tpv.webmanifest">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<script src="tpv-net.js?v=1"></script>
</head>
<body>
<title>B Lounge-Bar TPV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app shell — cabecera, área de trabajo con scroll, navegación inferior (móvil) o carril lateral (tablet/PC).
   Look único, oscuro: azul noche del lounge con el azul real del logo. */
:root{
  color-scheme:dark;
  --ink:#060B20;        /* fondo */
  --panel:#0D1636;      /* superficies */
  --panel-2:#15214A;    /* superficies elevadas */
  --line:rgba(150,172,255,.14);
  --royal:#2347D6;      /* color del logo */
  --royal-hi:#5A84FF;   /* interacción */
  --fg:#EDF1FF;
  --muted:#93A0C9;
  --gold:#DDBB72;       /* totales, con moderación */
  --free:#2EC48C; --busy:#F2A93B; --bill:#F0566A;
  --paper:#FBFAF6; --paper-ink:#1A1D2B;
  --fd:'Young Serif',Georgia,'Times New Roman',serif;
  --fu:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px;
  --gx:max(16px,env(safe-area-inset-left,0px));
  --gxr:max(16px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;background:var(--ink);color:var(--fg);font:15px/1.45 var(--fu);-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--royal-hi);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
header.top{display:flex;align-items:center;gap:12px;padding:10px var(--gxr) 10px var(--gx);border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0A1440,var(--ink))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.08),0 6px 20px rgba(35,71,214,.45)}
.brand b{font:400 19px/1.1 var(--fd);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-weight:600;font-size:13px;max-width:46vw}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--royal);font-weight:800;font-size:12px;flex:none}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--free);display:inline-block}
.sync.local i{background:var(--busy)}

main{overflow:auto;padding:16px var(--gxr) 24px var(--gx);overscroll-behavior:contain}
nav.nav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding:4px var(--gxr) calc(4px + env(safe-area-inset-bottom,0px)) var(--gx)}
main{grid-row:2;grid-column:1}nav.nav{grid-row:3;grid-column:1}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:10px;color:var(--muted);font-size:11px;font-weight:600;position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--fg);background:rgba(35,71,214,.22)}
.nav .badge{position:absolute;top:3px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bill);color:#fff;font-size:10px;line-height:18px;font-weight:800}
.nav .only-wide{display:none}
@media(min-width:900px){
  .app{grid-template-columns:210px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  header.top{grid-column:1/3}
  nav.nav{grid-row:2;grid-column:1;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:12px 10px 12px var(--gx);gap:4px}
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 12px;font-size:14px}
  .nav .only-wide{display:flex}.nav .only-narrow{display:none}
  .nav .badge{position:static;margin-left:auto}
  main{grid-row:2;grid-column:2;padding-left:24px}
}

/* tipografía y bloques */
h1.view{font:400 26px/1.15 var(--fd);margin:0;text-wrap:balance}
h2{font:700 13px/1.2 var(--fu);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:22px 0 10px}
.vhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.vhead .sub{color:var(--muted);font-size:13px}
.vhead .sp{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--royal);border-color:var(--royal);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap}
.btn.pri{background:var(--royal);border-color:var(--royal);color:#fff;box-shadow:0 8px 24px -10px rgba(35,71,214,.9)}
.btn.pri:hover{background:#2C55EE}
.btn.ok{background:var(--free);border-color:var(--free);color:#04140D}
.btn.warn{color:var(--busy);border-color:rgba(242,169,59,.4)}
.btn.danger{color:var(--bill);border-color:rgba(240,86,106,.4)}
.btn.danger.armed{background:var(--bill);color:#fff}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.stack{display:grid;gap:10px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em}
.pill.free{background:rgba(46,196,140,.14);color:var(--free)}
.pill.open{background:rgba(242,169,59,.15);color:var(--busy)}
.pill.bill{background:rgba(240,86,106,.16);color:var(--bill)}
.pill.blue{background:rgba(90,132,255,.16);color:var(--royal-hi)}
.empty{display:grid;justify-items:start;gap:12px;max-width:520px;padding:28px 0}
.empty h3{font:400 22px var(--fd);margin:0}
.empty p{margin:0;color:var(--muted)}

/* Sala */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.kpi .v{font:700 22px/1.2 var(--fu);font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v.gold{color:var(--gold)}
@media(max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tbl{position:relative;text-align:left;border-radius:18px;padding:14px;min-height:122px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;transition:transform .12s ease,border-color .12s}
.tbl:hover{border-color:rgba(90,132,255,.5)}
.tbl:active{transform:scale(.97)}
.tbl .nm{font:400 30px/1 var(--fd)}
.tbl .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.tbl .tot{margin-top:auto;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.tbl::before{content:"";position:absolute;inset:10px auto 10px 0;width:4px;border-radius:0 4px 4px 0;background:var(--free)}
.tbl.open{background:linear-gradient(160deg,rgba(242,169,59,.12),var(--panel) 60%)}
.tbl.open::before{background:var(--busy)}
.tbl.bill{background:linear-gradient(160deg,rgba(240,86,106,.16),var(--panel) 60%)}
.tbl.bill::before{background:var(--bill)}
.tbl.barra .nm,.tbl.billar .nm{font-size:24px}
.tbl.billar{background:linear-gradient(160deg,rgba(46,196,140,.10),var(--panel) 60%)}
.clk{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;color:var(--muted)}
.clk.run{color:var(--free)}
.billarp{margin-bottom:12px;background:linear-gradient(135deg,rgba(46,196,140,.10),var(--panel) 60%)}
.billarp.run{border-color:rgba(46,196,140,.45)}
.bclock{font:800 46px/1.05 var(--fu);letter-spacing:-.01em;margin:4px 0}
.billarp.run .bclock{color:var(--free)}
.bcost{font-size:24px;color:var(--gold)}

/* Comanda */
.order{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-height:100%}
@media(min-width:900px){.order{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}
.ohead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.back{width:44px;height:44px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-top:12px}
.prod{text-align:left;padding:12px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);min-height:86px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;transition:transform .1s,background .1s}
.prod:active{transform:scale(.96);background:var(--royal)}
.prod .pn{font-weight:700;font-size:14px;line-height:1.25}
.prod .pp{font-weight:800;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center;gap:6px}
.prod .pp s{color:var(--muted);font-weight:500;font-size:12px}
.prod .st{font-size:11px;font-weight:700;color:var(--busy)}
.prod:disabled{opacity:.42}
.ticket{background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:900px){.ticket{position:sticky;top:0;max-height:calc(100vh - 120px)}}
.ticket .th{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ticket .th b{font:400 20px var(--fd)}
.lines{overflow:auto;padding:6px 8px;flex:1;min-height:80px}
.ln{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:10px}
.ln:hover{background:rgba(255,255,255,.03)}
.qty{display:flex;align-items:center;gap:2px;background:var(--panel-2);border-radius:10px;border:1px solid var(--line)}
.qty button{width:32px;height:32px;font-size:18px;font-weight:700;color:var(--royal-hi)}
.qty span{min-width:20px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.ln .lt{text-align:left;min-width:0}
.ln .lt b{display:block;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.ln .lt small{color:var(--muted);font-size:12px}
.ln .lt .new{color:var(--royal-hi);font-weight:700}
.ln .lp{font-weight:700;font-variant-numeric:tabular-nums}
.ticket .tf{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:10px;background:var(--panel-2)}
.tot-row{display:flex;justify-content:space-between;align-items:baseline}
.tot-row b{font:800 26px var(--fu);font-variant-numeric:tabular-nums;color:var(--gold)}
.tf .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .acts .wide{grid-column:1/-1}
.guests{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:13px;color:var(--muted)}
.guests button{width:30px;height:30px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-weight:800}
/* móvil: ticket como hoja inferior */
.tbar{display:none}
@media(max-width:899px){
  .order .ticket{display:none}
  .order.sheet .ticket{display:flex;position:fixed;left:0;right:0;bottom:0;max-height:82%;z-index:30;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -20px 60px rgba(0,0,0,.6)}
  .order.sheet::after{content:"";position:fixed;inset:0;background:rgba(3,6,18,.6);z-index:29}
  .tbar{display:flex;position:sticky;bottom:0;margin-top:16px;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--royal);color:#fff;box-shadow:0 10px 30px -8px rgba(35,71,214,.9);width:100%;text-align:left}
  .tbar b{font-size:18px;font-variant-numeric:tabular-nums;margin-left:auto}
}

/* Cocina */
.kds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
@media(max-width:800px){.kds{grid-template-columns:minmax(0,1fr)}}
.kcol h2{margin-top:0;display:flex;gap:8px;align-items:center}
.kt{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.kt .kh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.kt .kh b{font:400 20px var(--fd)}
.kt .kh .tm{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;font-size:13px}
.kt.late .kh{background:rgba(240,86,106,.16)} .kt.late .tm{color:var(--bill)}
.kt.warn .kh{background:rgba(242,169,59,.12)} .kt.warn .tm{color:var(--busy)}
.kt ul{list-style:none;margin:0;padding:8px 12px;display:grid;gap:6px}
.kt li{display:flex;gap:10px}
.kt li b{min-width:26px;color:var(--royal-hi);font-variant-numeric:tabular-nums}
.kt li small{display:block;color:var(--busy);font-weight:600}
.kt .kf{padding:8px 12px 12px;display:flex;gap:8px;align-items:center}
.kt .kf small{color:var(--muted)}
.kt .kf .btn{margin-left:auto}

/* Caja e informes */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--royal)}
.chart .bar.hi{fill:var(--royal-hi)}
.chart .gl{stroke:var(--line)}
.chart text{fill:var(--muted);font:600 10px var(--fu)}
.rank{display:grid;gap:8px}
.rank .ri{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.rank .ri .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.rank .ri .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--royal),var(--royal-hi));border-radius:3px}
.list{display:grid}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .ic{width:38px;height:38px;border-radius:10px;background:var(--panel-2);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--royal-hi)}
.li .tx{min-width:0}
.li .tx b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .tx small{color:var(--muted);font-size:12px}
.li .vv{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.li.void .vv,.li.void b{text-decoration:line-through;color:var(--muted)}
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t td.r,table.t th.r{text-align:right}
.stk{display:inline-flex;align-items:center;gap:6px}
.stk button{width:30px;height:30px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-weight:800;color:var(--royal-hi)}
.happy{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(120deg,rgba(221,187,114,.14),var(--panel) 55%);border:1px solid rgba(221,187,114,.3)}
.happy b{font:400 18px var(--fd);color:var(--gold)}
.switch{width:52px;height:30px;border-radius:15px;background:var(--panel-2);border:1px solid var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch.on{background:var(--gold);border-color:var(--gold)}
.switch.on::after{transform:translateX(22px);background:#fff}

/* Más (móvil) */
.more{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.more button{text-align:left;padding:18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:grid;gap:6px}
.more button b{font:400 20px var(--fd)}
.more button small{color:var(--muted)}

/* Formularios */
label.f{display:grid;gap:6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.inp{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;background:var(--ink);border:1px solid var(--line);font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--fg)}
.inp:focus{border-color:var(--royal-hi);outline:none}
textarea.inp{min-height:70px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
@media(max-width:480px){.fgrid{grid-template-columns:minmax(0,1fr)}}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,6,18,.7);display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 0}
.modal[hidden]{display:none!important}
.mbox{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px var(--gxr) calc(18px + env(safe-area-inset-bottom,0px)) var(--gx);animation:up .18s ease-out}
@media(min-width:640px){.modal{align-items:center}.mbox{border-radius:22px;padding:22px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.mbox h3{font:400 24px var(--fd);margin:0 0 4px}
.mbox .mh{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.mbox .mh .x{margin-left:auto;width:40px;height:40px;border-radius:12px;background:var(--panel-2);font-size:20px}
.mbox .mf{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.mbox .mf .btn{flex:1}
.seg{display:flex;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--royal);color:#fff}
.payt{display:grid;gap:4px;padding:14px;border-radius:14px;background:var(--ink);border:1px solid var(--line);margin:12px 0}
.payt .tot-row b{font-size:32px}
.payt .r{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.sel-line{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px;text-align:left}
.sel-line.on{border-color:var(--royal-hi);background:rgba(90,132,255,.12)}
.sel-line .ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);flex:none}
.sel-line.on .ck{background:var(--royal-hi);border-color:var(--royal-hi)}
.sel-line .sp{flex:1}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:12px auto 0}
.pinpad button{height:60px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);font-size:22px;font-weight:700}
.dots{display:flex;justify-content:center;gap:12px;margin:8px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--royal-hi);border-color:var(--royal-hi)}
/* ticket impreso */
.receipt{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:22px 18px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;box-shadow:0 20px 50px rgba(0,0,0,.45);max-width:340px;margin:0 auto}
.receipt .c{text-align:center}
.receipt img{width:64px;height:64px;display:block;margin:0 auto 6px}
.receipt .rn{font:400 20px var(--fd);text-align:center}
.receipt hr{border:0;border-top:1px dashed #9a9a9a;margin:10px 0}
.receipt .rr{display:flex;justify-content:space-between;gap:10px}
.receipt .big{font-weight:800;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:700;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
.toast[hidden]{display:none!important}
/* Modo cliente */
body.kiosk .who,body.kiosk nav.nav{display:none!important}
@media(min-width:900px){body.kiosk main{grid-column:1/3}}
.cwrap{max-width:1180px;margin:0 auto}
.chead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.chead .sp{flex:1}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--royal-hi)}
.ctabs{position:sticky;top:-16px;z-index:6;background:var(--ink);padding:8px 0 10px;margin-bottom:6px}
.ctabs .seg button{min-height:44px;font-size:14px}
.ctabs .seg i{font-style:normal;background:var(--gold);color:#1a1405;border-radius:9px;padding:0 6px;margin-left:4px;font-size:11px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-top:12px}
.citem{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);min-width:0}
.citem .ctx{flex:1;min-width:0}
.citem .ctx b{display:block;font-weight:700;font-size:15px}
.citem .ctx p{margin:3px 0 0;color:var(--muted);font-size:13px;line-height:1.35}
.citem .cside{display:grid;justify-items:end;gap:8px;flex:none}
.citem .cpr{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.citem .cpr s{color:var(--muted);font-weight:500;font-size:12px;margin-right:4px}
.cadd{width:40px;height:40px;border-radius:12px;background:var(--royal);color:#fff;font-size:22px;font-weight:700;line-height:1}
.citem.off{opacity:.45}
.csec{font:400 22px var(--fd);margin:22px 0 4px;color:var(--fg)}
.cbar{position:sticky;bottom:0;margin-top:16px;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:var(--royal);color:#fff;width:100%;box-shadow:0 10px 30px -8px rgba(35,71,214,.9);text-align:left}
.cbar b{margin-left:auto;font-size:18px;font-variant-numeric:tabular-nums}
.callp{background:rgba(240,86,106,.16);color:var(--bill)}
.cliep{background:rgba(221,187,114,.18);color:var(--gold)}
.search{max-width:360px}
/* Imágenes de producto */
.pimg{position:relative;display:block;aspect-ratio:1;border-radius:14px;overflow:hidden;flex:none;background:var(--panel-2)}
.pimg svg,.pimg img{position:absolute;inset:0;width:100%;height:100%;display:block}
.pimg img{object-fit:cover}
.citem .pimg{width:84px}
@media(min-width:700px){.citem .pimg{width:100px}}
.prod .pimg{width:46px;border-radius:10px}
.prod .ptop{display:flex;gap:8px;align-items:flex-start}
.prod .ptop .pn{flex:1;min-width:0;overflow-wrap:anywhere;hyphens:auto}
td .pimg{width:36px;border-radius:9px}
.phedit{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.phedit .pimg{width:110px}
.qrg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.qrc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:10px;min-width:0}
.qrc img{width:100%;aspect-ratio:1240/1748;object-fit:cover;border-radius:10px;background:var(--ink)}
.qrc .qrt b{display:block;font:400 18px var(--fd)}
.qrc .qrt small{color:var(--muted);font-size:11px;overflow-wrap:anywhere}
/* billar animado */
.pool{display:block;width:100%;margin:4px 0 2px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.pool svg{width:100%;height:auto;display:block}
.pool.big{max-width:420px;margin:0 auto 14px}
.pool .pb,.pool .cue{animation-duration:6s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.2,.7,.3,1);animation-delay:var(--d,0ms)}
.pool .cb{animation-name:pcb}.pool .b1{animation-name:pb1}.pool .b2{animation-name:pb2}.pool .b3{animation-name:pb3}.pool .b4{animation-name:pb4}
.pool .cue{animation-name:pcue;animation-timing-function:ease-in-out}
@keyframes pcue{0%{transform:translate(40px,52px);opacity:1}12%{transform:translate(28px,52px)}17%{transform:translate(42px,52px)}24%{transform:translate(36px,52px);opacity:1}30%,100%{transform:translate(20px,52px);opacity:0}}
@keyframes pcb{0%,16%{transform:translate(48px,52px)}40%{transform:translate(118px,52px)}62%{transform:translate(104px,72px)}100%{transform:translate(98px,78px)}}
@keyframes pb1{0%,38%{transform:translate(128px,52px);opacity:1}62%{transform:translate(180px,20px);opacity:1}66%{transform:translate(186px,14px);opacity:0}96%{transform:translate(186px,14px);opacity:0}100%{transform:translate(128px,52px);opacity:1}}
@keyframes pb2{0%,40%{transform:translate(138px,45px)}70%{transform:translate(164px,30px)}100%{transform:translate(168px,28px)}}
@keyframes pb3{0%,42%{transform:translate(138px,59px)}72%{transform:translate(160px,80px)}100%{transform:translate(163px,83px)}}
@keyframes pb4{0%,46%{transform:translate(148px,52px)}80%{transform:translate(176px,56px)}100%{transform:translate(178px,56px)}}
.tbl.billar.open{border-color:rgba(46,196,140,.55);box-shadow:0 0 0 1px rgba(46,196,140,.2),0 10px 30px -12px rgba(46,196,140,.6)}
.tbl .tbh{justify-content:space-between;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tbl .nm{white-space:nowrap}.tbl .pill{white-space:nowrap}
.perml{display:grid;gap:2px}.perml .sel-line{font-size:14px}
.seg.req{border-color:var(--bill);box-shadow:0 0 0 3px rgba(240,86,106,.25);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.reqmsg{color:var(--bill);font-weight:700;font-size:14px;margin:8px 0 0}
.qsale{font-size:15px}
/* Web: avisos, agenda y acceso */
.alerts{display:grid;gap:8px;margin-bottom:16px}
.alert{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);text-align:left;width:100%}
.alert .at{flex:1;min-width:180px}.alert .at b{display:block;font:400 19px var(--fd)}.alert .at small{color:var(--muted);font-size:13px}

.alert.web{border-color:rgba(221,187,114,.45);background:linear-gradient(120deg,rgba(221,187,114,.14),var(--panel) 60%)}
.webbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;padding:10px 12px;border-radius:12px;background:rgba(90,132,255,.10);border:1px solid rgba(90,132,255,.3);margin:-2px 0 12px;font-size:14px}
.resl{display:grid;gap:10px}
.resc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.resc .rt{font:800 24px var(--fu);font-variant-numeric:tabular-nums;color:var(--gold);min-width:64px}
.resc.cancelada,.resc.rechazada,.resc.novino{opacity:.55}
.resc.pendiente{border-color:rgba(242,169,59,.5)}
.netlogin{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 50% 30%,#13246b,#060B20 70%)}
.nl-box{width:100%;max-width:380px;display:grid;gap:12px;padding:28px 22px;border-radius:22px;background:#0D1636;border:1px solid rgba(150,172,255,.18);color:#EDF1FF;font:15px/1.45 'Figtree',system-ui,sans-serif;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.nl-box h1{font:400 24px 'Young Serif',Georgia,serif;margin:0}.nl-box p{margin:0;color:#93A0C9}
.nl-logo{width:56px;height:56px;border-radius:50%;background:#2347D6;display:grid;place-items:center;font:700 28px Georgia,serif;color:#fff;box-shadow:0 8px 30px rgba(35,71,214,.6)}
.nl-box input{min-height:48px;padding:0 14px;border-radius:12px;border:1px solid rgba(150,172,255,.25);background:#060B20;color:#fff;font-size:16px}
.nl-box button{min-height:48px;border-radius:12px;border:0;background:#2347D6;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
.nl-box small{color:#F0566A;min-height:1em}
#syncTxt[data-net=off] i{background:var(--bill)}
.alert.balarm{border-color:rgba(242,169,59,.6);background:linear-gradient(120deg,rgba(242,169,59,.2),var(--panel) 60%);animation:balPulse 1.4s ease-in-out infinite}
@keyframes balPulse{50%{box-shadow:0 0 0 4px rgba(242,169,59,.25)}}
.alarmb{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--ink);border:1px dashed rgba(150,172,255,.25)}
.alarmb b{font:800 22px var(--fu);color:var(--gold)}

/* ---------- almacenamiento: nube (db) o este dispositivo ---------- */
const wq={};
function saveLocal(){if(mode==='local')lsSet(LS,S)}
function flush(col,id){
  if(mode!=='cloud'||!db){saveLocal();return}
  const key=col+'/'+id; const w=wq[key]||(wq[key]={busy:false,pending:false});
  if(w.busy){w.pending=true;return}
  w.busy=true;
  (async()=>{
    do{
      w.pending=false;
      const d=S[col][id];
      try{
        if(d){const body=Object.assign({},d);delete body.id;await db.collection(col).doc(id).set(body)}
        else await db.collection(col).doc(id).delete();
      }catch(e){dbErr(e)}
    }while(w.pending);
    w.busy=false;
  })();
}
function put(col,id,data){if(readOnly){toast('Solo lectura: no tienes permiso para guardar cambios');return}S[col][id]=Object.assign({},data,{id});flush(col,id)}
function del(col,id){if(readOnly)return;delete S[col][id];flush(col,id)}
function dbErr(e){
  const c=e&&e.code;
  if(c==='quota_exceeded')toast('Almacenamiento lleno: borra tickets antiguos para seguir guardando');
  else if(c==='invalid_argument'){readOnly=true;toast('No se pudo guardar: este acceso es de solo lectura')}
  else if(c==='revoked'){readOnly=true;toast('Se ha retirado el acceso a los datos')}
  else toast('No se pudo guardar. Revisa la conexión e inténtalo de nuevo');
}
let rq=false;
function schedule(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}

async function boot(){
  render();
  let ns=null;
  try{ns=window.BLB_NET?await window.BLB_NET.connect():(window.claude&&window.claude.use?await window.claude.use('db'):null)}catch(e){ns=null}
  if(ns){
    db=ns;mode='cloud';
    try{if(window.claude&&window.claude.use)window.claude.use('assets').then(a=>{assetsNS=a||null}).catch(()=>{})}catch(e){}
    let pending=COLS.length;
    COLS.forEach(c=>{
      db.collection(c).onSnapshot(snap=>{
        const next={};
        snap.docs.forEach(d=>{next[d.id]=Object.assign({},d.data(),{id:d.id})});
        Object.keys(wq).forEach(k=>{const [cc,id]=k.split('/');if(cc===c&&wq[k].busy){if(S[c][id])next[id]=S[c][id];else delete next[id]}});
        S[c]=next;
        if(pending>0&&!snap.metadata.fromCache){pending--;if(pending===0)loaded=true}
        if(pending>0&&snap.docs.length){}
        schedule();
      },e=>{dbErr(e);schedule()});
    });
    setTimeout(()=>{if(!loaded){loaded=true;schedule()}},4000);
  }else{
    mode='local';
    const d=lsGet(LS,null);
    if(d)COLS.forEach(c=>S[c]=d[c]||{});
    loaded=true;render();
  }
  const hm=location.hash.match(/^#mesa-([A-Za-z0-9_.~-]+)$/);if(hm)lsSet('blounge-kiosk',hm[1]);
}

function periodStart(){const d=dayStart();if(ui.period==='hoy')return d;if(ui.period==='7d')return d-6*864e5;const x=new Date(d);x.setDate(1);return x.getTime()}
function barChart(vals,labels,hiIdx){
  const W=640,H=200,pl=44,pb=22,pt=10,max=Math.max(1,...vals);
  const step=max>500?250:max>200?100:max>80?50:max>40?20:max>20?10:5;
  const top=Math.ceil(max/step)*step; const n=vals.length; const bw=(W-pl-8)/n;
  let g='';
  for(let v=0;v<=top;v+=top/ (top/step>4?Math.ceil(top/step/4)*1:1) / (top/step>4?1:1)){ }
  const ticks=[];const nt=Math.min(4,top/step);for(let i=0;i<=nt;i++)ticks.push(r2(top*i/nt));
  ticks.forEach(v=>{const y=pt+(H-pt-pb)*(1-v/top);g+=`<line class="gl" x1="${pl}" x2="${W-4}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${Math.round(v)} €</text>`});
  vals.forEach((v,i)=>{const h=(H-pt-pb)*(v/top);const x=pl+i*bw+bw*.15;
    g+=`<rect class="bar ${i===hiIdx?'hi':''}" x="${x}" y="${H-pb-h}" width="${bw*.7}" height="${Math.max(h,v>0?2:0)}" rx="3"><title>${labels[i]}: ${eur(v)}</title></rect>`;
    if(n<=16||i%2===0)g+=`<text x="${x+bw*.35}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por ${ui.period==='hoy'?'hora':'día'}">${g}</svg>`;
}
VIEWS.caja=()=>{
  const from=periodStart();
  const ss=salesFrom(from).sort((a,b)=>b.at-a.at);
  const allP=list('sales').filter(s=>s.at>=from).sort((a,b)=>b.at-a.at);
  const tot=ss.reduce((s,x)=>s+x.total,0), tips=ss.reduce((s,x)=>s+(x.tip||0),0);
  let vals=[],labels=[],hi=-1;
  if(ui.period==='hoy'){
    const b=new Array(24).fill(0);ss.forEach(s=>{b[(new Date(s.at).getHours()+18)%24]+=s.total});
    let a=6,z=18;ss.forEach(s=>{const i=(new Date(s.at).getHours()+18)%24;a=Math.min(a,i);z=Math.max(z,i)});
    for(let i=a;i<=z;i++){vals.push(r2(b[i]));labels.push(String((i+6)%24).padStart(2,'0')+'h')}
    hi=(new Date().getHours()+18)%24-a;
  }else{
    const days=ui.period==='7d'?7:Math.round((dayStart()-from)/864e5)+1;
    for(let i=0;i<days;i++){const s0=from+i*864e5;vals.push(r2(ss.filter(s=>s.at>=s0&&s.at<s0+864e5).reduce((q,x)=>q+x.total,0)));const d=new Date(s0);labels.push(ui.period==='7d'?d.toLocaleDateString('es-ES',{weekday:'short'}):String(d.getDate()))}
    hi=days-1;
  }
  const prodMap={};ss.forEach(s=>s.items.forEach(i=>{const m=prodMap[i.name]||(prodMap[i.name]={q:0,v:0});m.q+=i.qty;m.v+=i.qty*i.price}));

  return `<div class="chips">${cs.map(c=>`<button class="chip ${cl.cat===c&&!q?'on':''}" data-act="cl-cat" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>

  ${h.on?`<p class="pill cliep" style="margin:12px 0 0;font-size:13px;padding:6px 12px">Happy hour: −${h.pct}% en ${esc(h.cats.join(', '))}</p>`:''}

    return `<div class="citem ${out?'off':''}" data-cat="${esc(p.cat)}" data-q="${esc(pq)}" ${(q?!pq.includes(q):p.cat!==cl.cat)?'hidden':''}>${pic(p)}<div class="ctx"><b>${esc(p.name)}</b>${p.desc?`<p>${esc(p.desc)}</p>`:''}</div>
      <div class="cside"><span class="cpr" ${p.price>0?'':'hidden'}>${fromPrice(p)?'<small class="muted" style="font-weight:600">desde</small> ':''}${pr!==p.price?`<s>${eur(p.price)}</s>`:''}${eur(pr)}</span>${out?'<small class="muted">Agotado</small>':inC?`<div class="qty"><button data-act="cl-qty" data-k="${inC.k}" data-d="-1" aria-label="Quitar uno">−</button><span>${inC.qty}</span><button data-act="cl-qty" data-k="${inC.k}" data-d="1" aria-label="Añadir uno">+</button></div>`:`<button class="cadd" data-act="cl-add" data-id="${p.id}" aria-label="Añadir ${esc(p.name)}">+</button>${nOpt?`<small class="muted">${nOpt} en tu pedido</small>`:''}`}</div></div>`}).join('')}</div>

}
const cartTotal=()=>r2(cl.cart.reduce((s,i)=>{const p=S.products[i.pid];return s+(p?unitPrice(p,i.sel):0)*i.qty},0));
function clPedido(){

const RST={pendiente:['Pendiente','open'],confirmada:['Confirmada','free'],llegaron:['Han llegado','blue'],novino:['No vinieron','bill'],cancelada:['Cancelada','bill'],rechazada:['Sin sitio','bill']};
VIEWS.agenda=()=>{
  ui.ag=ui.ag||'proximas';
  const all=list('reservas').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const today=isoDay(0),tom=isoDay(1),wk=isoDay(7);
  const pend=all.filter(r=>r.status==='pendiente');
  const F={pendientes:r=>r.status==='pendiente',hoy:r=>r.date===today,manana:r=>r.date===tom,proximas:r=>r.date>=today&&r.date<=wk,todas:r=>true,pasadas:r=>r.date<today};
  const L={pendientes:`Por confirmar${pend.length?' ('+pend.length+')':''}`,hoy:'Hoy',manana:'Mañana',proximas:'Próximos 7 días',todas:'Todas',pasadas:'Pasadas'};
  let shown=all.filter(F[ui.ag]);if(ui.ag==='pasadas')shown=shown.reverse();
  const by={};shown.forEach(r=>(by[r.date]=by[r.date]||[]).push(r));
  const paxDay=d=>all.filter(r=>r.date===d&&!['cancelada','rechazada','novino'].includes(r.status)).reduce((s,r)=>s+(parseInt(r.pax)||0),0);
  return `<div class="vhead"><div><h1 class="view">Reservas</h1><div class="sub">Las reservas de la web llegan aquí al momento. Hoy: ${paxDay(today)} personas reservadas.</div></div><div class="sp"></div><button class="btn pri" data-act="res-new">Nueva reserva</button></div>
  <div class="chips" style="margin-bottom:14px">${Object.keys(L).map(k=>`<button class="chip ${ui.ag===k?'on':''}" data-act="ag" data-k="${k}">${L[k]}</button>`).join('')}</div>
  ${shown.length?Object.entries(by).map(([d,rs])=>`<h2>${esc(fmtDay(d))} · ${paxDay(d)} pers.</h2><div class="resl">${rs.map(resCard).join('')}</div>`).join(''):`<div class="empty"><h3>No hay reservas aquí</h3><p>Cuando alguien reserve desde la web, aparecerá en esta agenda y sonará un aviso.</p></div>`}`;
};

function billarAlarmStrip(){
  const ts=tables().filter(t=>isBillar(t)&&t.alarmSecs&&tSecs(t)>=t.alarmSecs);
  if(!ts.length)return '';
  return `<div class="alerts">${ts.map(t=>`<div class="alert balarm"><div class="at"><b>⏰ ${esc(tLabel(t))}: tiempo cumplido</b><small>Programado ${fmtMins(t.alarmMin||Math.round(t.alarmSecs/60))} · jugado <span data-tick="${t.id}" data-f="clock">${fmtClock(tSecs(t))}</span>${t.timerStart?' · sigue contando':''}</small></div>
    <div class="aa"><button class="btn sm" data-act="bal-add" data-t="${t.id}" data-m="15">+15 min</button><button class="btn sm pri" data-act="open-table" data-id="${t.id}">Parar y cobrar</button><button class="btn sm" data-act="bal-clear" data-t="${t.id}">Quitar aviso</button></div></div>`).join('')}</div>`;
}
const seenAl=new Set();let alInit=false;
function watchBillar(){
  if(!loaded)return;
  let crossed=false;
  tables().filter(t=>isBillar(t)&&t.alarmSecs).forEach(t=>{const s=tSecs(t),left=t.alarmSecs-s;
    const kDone=t.id+':'+t.alarmSecs,kWarn=kDone+':w';
    if(left<=0&&!seenAl.has(kDone)){seenAl.add(kDone);seenAl.add(kWarn);crossed=true;
      if(alInit){beep('ready');setTimeout(()=>beep('ready'),900);setTimeout(()=>beep('ready'),1800);toast('⏰ '+tLabel(t)+': se cumplió el tiempo ('+fmtMins(t.alarmMin||Math.round(t.alarmSecs/60))+')');
        try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}if(document.hidden){unread++;document.title='('+unread+') ⏰ Billar'}}}
    else if(left>0&&left<=300&&t.alarmSecs>=600&&!seenAl.has(kWarn)){seenAl.add(kWarn);if(alInit){beep('res');toast('Billar: quedan 5 minutos')}}});
  alInit=true;
  if(crossed&&(ui.view==='sala'||ui.table))render();
}

function beep(kind){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const seq=kind==='ready'?[880,1175,1568]:kind==='res'?[660,880]:[784,988,784];
  seq.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(actx.destination);const t0=actx.currentTime+i*.18;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.35,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.16);o.start(t0);o.stop(t0+.18)})}catch(e){}}

A['pay-confirm']=()=>{
  if(!pay.method){pay.needMethod=true;renderPay();toast('Elige la forma de pago antes de cobrar');return}
  const t=Object.assign({},S.tables[pay.tid]);const lines=payLines();if(!lines.length)return;
  const c=payCalc();const given=parseFloat(String(pay.given).replace(',','.'))||0;
  if(pay.method==='efectivo'&&pay.given&&given<c.charge){toast('Falta dinero: entregado '+eur(given)+' de '+eur(c.charge));return}
  const d0=dayStart();const n=list('sales').filter(s=>s.at>=d0).length+1;const dd=new Date(d0);
  const no=String(dd.getFullYear()).slice(2)+String(dd.getMonth()+1).padStart(2,'0')+String(dd.getDate()).padStart(2,'0')+'-'+String(n).padStart(3,'0');
  const sale={no,at:now(),table:t.name,tableId:t.id,items:lines.map(i=>({pid:i.pid,name:i.name,qty:i.qty,price:i.price})),subtotal:c.sub,discPct:pay.disc,discount:c.disc,total:c.total,tip:c.tip,method:pay.method,
    given:pay.method==='efectivo'?(given||c.charge):null,change:pay.method==='efectivo'?r2(Math.max(0,(given||c.charge)-c.charge)):null,staff:meName(),staffId:me||null,customerId:pay.cust||null,iva:cfg().iva,guests:t.guests||0,void:false};
  const sid=uid();put('sales',sid,sale);
  lines.forEach(i=>{const p=S.products[i.pid];if(p&&typeof p.stock==='number'){put('products',p.id,Object.assign({},p,{stock:p.stock-i.qty}))}});
  if(pay.cust&&S.customers[pay.cust]){const cu=S.customers[pay.cust];put('customers',cu.id,Object.assign({},cu,{points:(cu.points||0)+Math.floor(c.charge),visits:(cu.visits||0)+1,spent:r2((cu.spent||0)+c.charge),last:now()}))}
  const keys=lines.map(i=>i.k);t.items=(t.items||[]).filter(i=>!keys.includes(i.k));
  if(!t.items.length&&!hasTimer(t)){t.bill=false;t.openedAt=null;t.guests=0;t.waiter=null;t.customerId=null;t.call=null;t.sess=null;t.webCust=null;t.ready=null;t.webNew=null}
  if(t.temp&&!t.items.length)del('tables',t.id);else put('tables',t.id,t);
  const left=t.items.length;
  const doPrint=pay.print;pay=null;showTicket(sid);if(doPrint)setTimeout(()=>printTicket(sid),250);
  if(!left){ui.view='sala';ui.sheet=false}
  render();
};

function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const m=800,sc=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.82)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}
async function uploadPhoto(inp){
  const f=inp.files&&inp.files[0];if(!f||!assetsNS)return;const id=inp.dataset.id;toast('Subiendo foto…');
  try{const blob=await shrink(f);const r=await assetsNS.upload(blob,{type:'image/jpeg'});const p=S.products[id];if(!p)return;put('products',id,Object.assign({},p,{photo:r.id}));
    const box=$('#ph-box .pimg');if(box)box.outerHTML=pic(S.products[id]);render();toast('Foto guardada')}
  catch(e){const c=e&&e.code;toast(c==='too_large'?'La foto es demasiado grande':c==='unsupported_type'?'Usa una foto JPG, PNG o WEBP':c==='quota_or_state'?'No queda espacio para más fotos':'No se pudo subir la foto. Inténtalo de nuevo')}
}

function showTicket(id){
  const s=S.sales[id];if(!s)return;
  openModal(mh('Ticket '+esc(s.no),s.void?'Anulado':'Cobrado '+hhmm(s.at))+receipt(s)+
   `<div class="mf">${s.void?'':`<button class="btn" data-act="sale-edit" data-id="${id}">✏️ Editar</button><button class="btn warn" data-act="void" data-id="${id}">Anular</button>`}<button class="btn danger" data-act="sale-del" data-id="${id}">Borrar</button><button class="btn" data-act="print-ticket" data-id="${id}">🖨️ Imprimir</button><button class="btn pri" data-act="close">Hecho</button></div>`);
}
/* Impresión del ticket en un marco aparte, a 80 mm (impresoras de tickets) o en A4 si es una impresora normal */
function printTicket(id){
  const s=S.sales[id];if(!s)return;
  const html=receipt(s);
  let f=document.getElementById('printFrame');if(f)f.remove();
  f=document.createElement('iframe');f.id='printFrame';f.setAttribute('aria-hidden','true');
  f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(f);
  const d=f.contentDocument;
  d.open();d.write(`<!doctype html><html><head><meta charset="utf-8"><title>Ticket ${esc(s.no)}</title><style>
    @page{size:80mm auto;margin:3mm}
    *{box-sizing:border-box}body{margin:0;color:#000;background:#fff;font:12px/1.45 ui-monospace,Menlo,Consolas,'Courier New',monospace}
    .receipt{width:72mm;margin:0 auto;padding:2mm 0}.receipt .c{text-align:center}.receipt img{width:22mm;height:22mm;display:block;margin:0 auto 2mm;filter:grayscale(1) contrast(1.4)}
    .receipt .rn{font:700 16px Georgia,serif;text-align:center}.receipt hr{border:0;border-top:1px dashed #000;margin:2mm 0}
    .receipt .rr{display:flex;justify-content:space-between;gap:3mm}.receipt .big{font-weight:800;font-size:15px}
  </style></head><body>${html}</body></html>`);d.close();
  let done=false;const go=()=>{if(done)return;done=true;try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast('No se pudo abrir la impresión')}};
  const img=d.querySelector('img');if(img&&!img.complete){img.onload=go;img.onerror=go;setTimeout(go,1200)}else setTimeout(go,100);
}
A['print-ticket']=el=>printTicket(el.dataset.id);
A.ticket=el=>showTicket(el.dataset.id);
/* ---------- editar o borrar una venta ---------- */
var se=null;
function stockBack(items,sign){(items||[]).forEach(i=>{const p=S.products[i.pid];if(p&&typeof p.stock==='number')put('products',p.id,Object.assign({},p,{stock:p.stock+sign*i.qty}))})}
function seCalc(){const s=S.sales[se.id];const sub=r2(se.items.reduce((q,i)=>q+i.price*i.qty,0));const discount=r2(sub*(s.discPct||0)/100);const total=r2(sub-discount);return{sub,discount,total,charge:r2(total+(s.tip||0))}}
function renderSE(){const s=S.sales[se.id];if(!s){closeModal();return}const c=seCalc();
  openModal(mh('Editar venta '+esc(s.no),'Mesa '+esc(s.table)+' · '+dmy(s.at)+' '+hhmm(s.at))+`
  <div class="list">${se.items.map((i,ix)=>`<div class="li" style="grid-template-columns:auto minmax(0,1fr) auto auto"><span class="qty"><button data-act="se-qty" data-i="${ix}" data-d="-1">−</button><span>${i.qty}</span><button data-act="se-qty" data-i="${ix}" data-d="1">+</button></span>
    <span class="tx"><b>${esc(i.name)}</b><small>${eur(i.price)} c/u</small></span><span class="vv">${eur(i.price*i.qty)}</span><button class="btn sm danger" data-act="se-rm" data-i="${ix}" aria-label="Quitar">✕</button></div>`).join('')||'<p class="muted">Sin productos. Si no queda nada, mejor borra o anula la venta.</p>'}</div>
  <h2>Forma de pago</h2><div class="seg">${['tarjeta','efectivo','bizum'].map(m=>`<button class="${se.method===m?'on':''}" data-act="se-method" data-m="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div>
  <div class="payt">${s.discPct?`<div class="r"><span>Descuento ${s.discPct}%</span><span>−${eur(c.discount)}</span></div>`:''}${s.tip?`<div class="r"><span>Propina</span><span>${eur(s.tip)}</span></div>`:''}
    <div class="tot-row"><span>Total nuevo</span><b>${eur(c.total)}</b></div><div class="r"><span>Antes</span><span>${eur(s.total)}</span></div></div>
  <div class="mf"><button class="btn" data-act="se-cancel">Volver</button><button class="btn pri" data-act="se-save" ${se.items.length?'':'disabled'}>Guardar cambios</button></div>`)}
A['sale-edit']=el=>{const s=S.sales[el.dataset.id];if(!s)return;se={id:s.id,items:s.items.map(i=>Object.assign({},i)),method:s.method};renderSE()};
A['se-qty']=el=>{const i=se.items[+el.dataset.i];i.qty=Math.max(1,i.qty+(+el.dataset.d));renderSE()};
A['se-rm']=el=>{se.items.splice(+el.dataset.i,1);renderSE()};
A['se-method']=el=>{se.method=el.dataset.m;renderSE()};
A['se-cancel']=()=>{const id=se.id;se=null;showTicket(id)};
A['se-save']=()=>{const s=S.sales[se.id];if(!s||!se.items.length)return;const c=seCalc();
  stockBack(s.items,1);stockBack(se.items,-1);
  const keepCash=se.method==='efectivo'&&s.method==='efectivo'&&s.given&&s.given>=c.charge;
  put('sales',s.id,Object.assign({},s,{items:se.items,subtotal:c.sub,discount:c.discount,total:c.total,method:se.method,given:se.method==='efectivo'?(keepCash?s.given:c.charge):null,change:se.method==='efectivo'?(keepCash?r2(s.given-c.charge):0):null,edited:true,editedAt:now(),editedBy:meName(),before:s.before||{total:s.total,method:s.method,items:s.items}}));
  const id=se.id;se=null;toast('Venta modificada');showTicket(id);render()};
A['sale-del']=el=>arm(el,()=>{const s=S.sales[el.dataset.id];if(!s)return;if(!s.void)stockBack(s.items,1);del('sales',s.id);closeModal();render();toast('Venta '+s.no+' borrada')});
A.void=el=>arm(el,()=>{const s=S.sales[el.dataset.id];if(!s)return;put('sales',s.id,Object.assign({},s,{void:true,voidAt:now(),voidBy:meName()}));
  s.items.forEach(i=>{const p=S.products[i.pid];if(p&&typeof p.stock==='number')put('products',p.id,Object.assign({},p,{stock:p.stock+i.qty}))});closeModal();render();toast('Ticket anulado y stock devuelto')});

/* ---------- cocina ---------- */
A['kds-next']=el=>{const k=S.kitchen[el.dataset.id];if(!k)return;if(k.status==='ready'){del('kitchen',k.id)}else put('kitchen',k.id,Object.assign({},k,{status:k.status==='new'?'prep':'ready'}));render()};

/* ---------- cierre de caja ---------- */
A.cierre=()=>{
  const last=list('cash').sort((a,b)=>b.at-a.at)[0];const from=last?last.at:dayStart();
  const ss=list('sales').filter(s=>!s.void&&s.at>=from);const sum=m=>r2(ss.filter(s=>s.method===m).reduce((q,s)=>q+s.total+(s.tip||0),0));
  const fondo=cfg().fondo;const cash=sum('efectivo');const exp=r2(fondo+cash);
  openModal(mh('Cierre de caja','Desde '+dmy(from)+' '+hhmm(from)+' · '+ss.length+' tickets')+`
   <div class="payt"><div class="r"><span>Fondo inicial</span><span>${eur(fondo)}</span></div><div class="r"><span>Efectivo cobrado</span><span>${eur(cash)}</span></div>

/* ---------- roles y permisos ---------- */
const PERMS=[['cobrar','Cobrar mesas y pedidos'],['descuentos','Descuentos e invitaciones al cobrar'],['anular','Anular, editar y borrar ventas; quitar productos ya enviados; descartar tiempo de billar'],['caja','Ver la caja, informes y hacer el cierre'],['stock','Cambiar carta, precios, stock y happy hour'],['reservas','Gestionar reservas'],['clientes','Ver y editar clientes'],['personal','Gestionar personal, roles y permisos'],['ajustes','Ajustes, mesas, códigos QR y clave del TPV']];
const ROLES={admin:{n:'Administrador',d:'Puede hacerlo todo',p:PERMS.map(x=>x[0])},mesero:{n:'Mesero',d:'Toma nota, cobra y gestiona reservas',p:['cobrar','reservas','clientes']},cocina:{n:'Cocina',d:'Solo ve la pantalla de cocina',p:[]}};
const rolOf=p=>(p&&ROLES[p.rol])?p.rol:'admin';
const permsOf=p=>p?(Array.isArray(p.perms)?p.perms:ROLES[rolOf(p)].p):[];
const protectedMode=()=>list('staff').some(p=>rolOf(p)==='admin'&&p.pin);
function can(k){if(!protectedMode())return true;return permsOf(S.staff[me]).includes(k)}
const VIEW_PERM={agenda:'reservas',caja:'caja',stock:'stock',personal:'personal',clientes:'clientes',ajustes:'ajustes',qr:'ajustes'};
function canView(v){if(!protectedMode())return true;const p=S.staff[me];
  if(p&&rolOf(p)==='cocina')return v==='cocina'||v==='mas'||(VIEW_PERM[v]&&can(VIEW_PERM[v]));
  return !VIEW_PERM[v]||can(VIEW_PERM[v])}
const ACT_PERM={'sale-edit':'anular','sale-del':'anular','pay':'cobrar','pay-confirm':'cobrar','pay-disc':'descuentos','void':'anular','billar-reset':'anular','cierre':'caja','save-cierre':'caja',
  'prod-new':'stock','prod-edit':'stock','prod-save':'stock','prod-del':'stock','stk':'stock','soldout':'stock','happy':'stock','happy-edit':'stock','happy-save':'stock','photo-del':'stock',
  'staff-new':'personal','staff-edit':'personal','staff-save':'personal','staff-del':'personal','cust-new':'clientes','cust-edit':'clientes','cust-save':'clientes','cust-del':'clientes',
  'res-st':'reservas','res-del':'reservas','res-new':'reservas','res-save':'reservas','table-new':'ajustes','table-edit':'ajustes','table-save':'ajustes','table-del':'ajustes','cfg-save':'ajustes','net-clave':'ajustes'};
function actPerm(el){const a=el.dataset.act;
  if(a==='line-del'){const t=S.tables[ui.table];const l=t&&(t.items||[]).find(i=>i.k===el.dataset.k);return l&&l.sent?'anular':null}
  if(a==='nav')return VIEW_PERM[el.dataset.v]||null;
  return ACT_PERM[a]||null}
function deny(k){const p=S.staff[me];const lbl=(PERMS.find(x=>x[0]===k)||[k,k])[1].toLowerCase();
  toast(p?`${p.name.split(' ')[0]} no tiene permiso para: ${lbl}. Pide a un administrador que lo active.`:'Elige quién atiende (arriba a la derecha) para continuar.')}
VIEWS.noperm=()=>`<div class="empty"><h3>Sin permiso</h3><p>${S.staff[me]?esc(S.staff[me].name)+' no tiene acceso a esta sección.':'Elige quién atiende para ver esta sección.'} Un administrador puede darte acceso en Personal.</p><button class="btn pri" data-act="who">Cambiar de usuario</button></div>`;

  const rolB=document.querySelector('#s-rol .on');const rol=rolB?rolB.dataset.r:'mesero';const perms=[...document.querySelectorAll('#s-perms .on')].map(b=>b.dataset.k);
  if(rol==='admin'&&!pin){toast('Un administrador necesita PIN para que nadie más entre con su usuario');return}

  put('staff',id,Object.assign({},S.staff[id]||{onShift:null},{name,role:val('s-role')||ROLES[rol].n,pin,rol,perms}));if(!wasProt&&rol==='admin'&&pin&&!S.staff[me]){me=id;lsSet('blounge-me',id)}
  closeModal();render();toast(!wasProt&&protectedMode()?'Permisos activados. Ahora atiende '+name:'Guardado: '+name+' · '+ROLES[rol].n)};
A['rol-pick']=el=>{document.querySelectorAll('#s-rol button').forEach(b=>b.classList.toggle('on',b===el));const ps=ROLES[el.dataset.r].p;document.querySelectorAll('#s-perms .sel-line').forEach(b=>b.classList.toggle('on',ps.includes(b.dataset.k)))};
A['perm-tog']=el=>el.classList.toggle('on');
A['staff-del']=el=>arm(el,()=>{if(rolOf(S.staff[el.dataset.id])==='admin'&&S.staff[el.dataset.id].pin&&list('staff').filter(x=>rolOf(x)==='admin'&&x.pin).length<=1){toast('No puedes borrar al único administrador');return}del('staff',el.dataset.id);if(me===el.dataset.id){me=null;lsSet('blounge-me',null)}closeModal();render()});
let pin=null;
function askPin(staffId,then){const p=S.staff[staffId];if(!p||!p.pin){then();return}pin={staffId,then,buf:''};renderPin()}
function renderPin(){const p=pin.any?{name:'personal'}:S.staff[pin.staffId];openModal(mh('PIN de '+esc(p.name),pin.any?'Solo el personal del bar puede salir del modo cliente':'Introduce tus 4 cifras')+`<div class="dots">${[0,1,2,3].map(i=>`<i class="${pin.buf.length>i?'on':''}"></i>`).join('')}</div>
  <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="pin-key" data-k="${n}">${n}</button>`).join('')}<button data-act="pin-key" data-k="del" aria-label="Borrar">⌫</button><button data-act="pin-key" data-k="0">0</button><button data-act="close" aria-label="Cancelar">✕</button></div>`)}
A['pin-key']=el=>{const k=el.dataset.k;if(k==='del')pin.buf=pin.buf.slice(0,-1);else pin.buf+=k;
  if(pin.buf.length===4){if(pin.any?list('staff').some(s=>s.pin&&s.pin===pin.buf):pin.buf===S.staff[pin.staffId].pin){const f=pin.then;pin=null;closeModal();f()}else{pin.buf='';renderPin();toast('PIN incorrecto');return}}else renderPin()};

  else{const sid=uid();put('shifts',sid,{staff:id,in:now(),out:null});put('staff',id,Object.assign({},p,{onShift:sid}));toast(p.name+' ha fichado la entrada')}render()})};
